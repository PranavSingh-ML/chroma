name: build-image

# Builds server/ into ghcr.io/<owner>/chroma-lora:<tag> and prints the digest.
# Trigger: push a tag (git tag v1 && git push origin v1) or run manually with a tag input.
# Never produces :latest.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "image tag, e.g. v1"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk (torch + CUDA libs need room)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Resolve image name
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          [ "$TAG" != "latest" ] || { echo "refusing to tag :latest"; exit 1; }
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${OWNER}/chroma-lora:${TAG}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Warn if lock is provisional
        run: head -1 server/requirements.lock.txt | grep -q PROVISIONAL && echo "::warning::requirements.lock.txt is PROVISIONAL - run Phase 0 and rebuild" || true

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: server
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### pushed \`${{ steps.meta.outputs.image }}\`"
            echo "digest: \`${{ steps.build.outputs.digest }}\`"
            echo
            echo "Record both in NOTES.md. Pod: --image ${{ steps.meta.outputs.image }} --ports 8000/http,22/tcp --container-disk-in-gb 100"
          } >> "$GITHUB_STEP_SUMMARY"
